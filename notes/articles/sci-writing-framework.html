<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCI 写作框架 · 学术写作</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1c1c1e;--muted:#6b7280;--accent:#9b7ae8;--heading:#d4a5d8;--shadow:0 4px 24px rgba(0,0,0,.06);--font:'DM Sans','Noto Sans SC',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 64px}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:inline-flex;padding:9px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--muted);font-size:.88rem;font-weight:500}
.chip:hover{color:var(--text)}
.article{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:32px 34px 40px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--heading);margin-bottom:10px}
h1{font-size:1.55rem;font-weight:700;margin-bottom:8px}
.meta{color:var(--muted);font-size:.88rem;margin-bottom:18px}
p{color:#374151;margin-bottom:12px}
.gallery{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.gallery figure{margin:0;border-radius:14px;overflow:hidden;border:1px solid #eceef2;background:#fafafa}
.gallery img{width:100%;display:block}
.gallery figcaption{padding:8px 12px;font-size:.8rem;color:var(--muted);background:#fff}
.tip{margin-top:18px;padding:12px 14px;border-radius:14px;background:#fff8eb;border:1px solid #fde68a;color:#92400e;font-size:.86rem}
@media(max-width:640px){.article{padding:22px 16px 28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="chip" href="../../notes.html#sci-framework">← 返回笔记</a>
    <a class="chip" href="../files/SCI%E5%86%99%E4%BD%9C%E6%A1%86%E6%9E%B6.docx" download>下载 Word</a>
    <a class="chip" href="study-area-map.html">研究区概况绘制 →</a>
  </div>
  <article class="article">
    <div class="eyebrow">学术写作 / SCI 写作框架</div>

      <figure><img src="sci-framework/01.jpg" alt="SCI框架 第1页"><figcaption>第 1 页</figcaption></figure>

      <figure><img src="sci-framework/04.jpg" alt="SCI框架 第4页"><figcaption>第 4 页</figcaption></figure>
      <figure><img src="sci-framework/05.jpg" alt="SCI框架 第5页"><figcaption>第 5 页</figcaption></figure>

</div>
