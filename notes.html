<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学术方向笔记 · Yongbo Zhao</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c4b5fd'/><text x='50' y='68' text-anchor='middle' font-size='48' font-family='system-ui' fill='white' font-weight='700'>Z</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#1c1c1e;
  --muted:#8a8f98;
  --muted-2:#6b7280;
  --accent:#b794f6;
  --accent-strong:#9b7ae8;
  --accent-soft:#efe6ff;
  --heading:#d4a5d8;
  --border:#eceef2;
  --radius:24px;
  --shadow:0 4px 24px rgba(0,0,0,.06);
  --font:'DM Sans','Noto Sans SC',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:var(--accent-strong);text-decoration:none}
a:hover{opacity:.85}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:28px 20px 56px;
  animation:rise .6s ease both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:18px;flex-wrap:wrap;
}
.back{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;
  background:var(--card);box-shadow:var(--shadow);
  color:var(--muted-2);font-size:.9rem;font-weight:500;
  transition:color .2s,transform .2s;
}
.back:hover{color:var(--text);opacity:1;transform:translateY(-1px)}
.back svg{width:16px;height:16px}
.top-title{
  font-size:.78rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--heading);
}

.layout{
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  gap:18px;
  align-items:start;
}

.dir-card,.notes-card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.dir-card{padding:20px 16px;position:sticky;top:24px}
.dir-head{
  font-size:.78rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--heading);
  padding:0 8px 12px;
}
.dir-list{display:flex;flex-direction:column;gap:6px}
.dir-btn{
  width:100%;text-align:left;
  padding:12px 14px;border-radius:14px;
  color:var(--muted-2);font-size:.92rem;font-weight:500;
  transition:background .2s,color .2s;
}
.dir-btn:hover{background:var(--bg);color:var(--text)}
.dir-btn.active{
  background:var(--accent-soft);
  color:var(--accent-strong);
  font-weight:600;
}
.dir-btn .en{
  display:block;font-size:.72rem;font-weight:500;
  color:var(--muted);margin-top:2px;letter-spacing:.02em;
}
.dir-btn.active .en{color:var(--accent-strong);opacity:.75}
.dir-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:20px;padding:0 6px;margin-left:8px;
  border-radius:999px;background:rgba(0,0,0,.06);
  font-size:.7rem;font-weight:600;vertical-align:middle;
}
.dir-btn.active .dir-count{background:rgba(155,122,232,.2)}

.notes-card{padding:28px 30px 34px;min-height:480px}
.notes-head{margin-bottom:8px}
.notes-label{
  font-size:.78rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--heading);
}
.notes-title{
  font-size:1.45rem;font-weight:700;letter-spacing:-.03em;
  margin:6px 0 4px;
}
.notes-desc{
  color:var(--muted-2);font-size:.95rem;margin-bottom:22px;
  max-width:56ch;
}
.note-list{display:flex;flex-direction:column;gap:14px}
.note{
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  transition:border-color .2s,box-shadow .2s;
  animation:fadeIn .35s ease both;
}
.note:hover{border-color:#e0d4f5;box-shadow:0 6px 18px rgba(155,122,232,.08)}
.note-meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:6px;
}
.note-date{
  font-size:.72rem;font-weight:600;color:var(--muted);
  background:#f0f1f4;padding:2px 8px;border-radius:6px;
}
.note-tag{
  font-size:.7rem;font-weight:600;color:var(--accent-strong);
  background:var(--accent-soft);padding:2px 8px;border-radius:6px;
}
.note h3{font-size:1.02rem;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.note p{font-size:.9rem;color:var(--muted-2);line-height:1.55}
.empty{
  text-align:center;padding:48px 16px;color:var(--muted);
  font-size:.95rem;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .dir-card{position:static;padding:14px}
  .dir-list{
    flex-direction:row;overflow-x:auto;gap:8px;
    padding-bottom:4px;scrollbar-width:none;
  }
  .dir-list::-webkit-scrollbar{display:none}
  .dir-btn{white-space:nowrap;flex-shrink:0;width:auto}
  .dir-btn .en{display:none}
  .notes-card{padding:22px 18px 28px;min-height:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      返回主页
    </a>
    <div class="top-title">Research Notes</div>
  </div>

  <div class="layout">
    <aside class="dir-card">
      <div class="dir-head">研究方向</div>
      <div class="dir-list" id="dir-list" role="tablist" aria-label="学术方向"></div>
    </aside>

    <main class="notes-card">
      <div class="notes-head">
        <div class="notes-label">Notes</div>
        <h1 class="notes-title" id="notes-title">—</h1>
        <p class="notes-desc" id="notes-desc"></p>
      </div>
      <div class="note-list" id="note-list"></div>
    </main>
  </div>
</div>

<script>
/**
 * 学术方向笔记数据
 * 新增方向：在 directions 数组末尾追加一个对象即可
 * 新增笔记：在对应方向的 notes 数组中追加条目
 */
const directions = [
  {
    id: 'cartography-gis',
    title: '地图学与 GIS',
    titleEn: 'Cartography & GIS',
    description: '地图表达、空间分析与地理信息系统方法相关笔记。',
    notes: [
      {
        title: '空间数据模型梳理',
        date: '2026-07',
        tag: '基础',
        body: '占位笔记：矢量 / 栅格数据模型、拓扑关系与常用坐标系转换要点，待补充正式内容。'
      },
      {
        title: '专题制图表达原则',
        date: '2026-06',
        tag: '制图',
        body: '占位笔记：视觉变量、图例设计与多尺度表达的常见实践，待替换为读书与课程笔记。'
      }
    ]
  },
  {
    id: 'remote-sensing',
    title: '遥感与地学信息',
    titleEn: 'Remote Sensing',
    description: '遥感影像处理、地物提取与地学信息挖掘相关笔记。',
    notes: [
      {
        title: '影像预处理流程备忘',
        date: '2026-05',
        tag: '流程',
        body: '占位笔记：辐射校正、大气校正与裁剪镶嵌流程提纲，待补充软件操作与参数记录。'
      }
    ]
  },
  {
    id: 'eco-geo',
    title: '生态地理交叉',
    titleEn: 'Eco-Geography',
    description: '生态过程与地理空间方法交叉方向的阅读与研究笔记。',
    notes: [
      {
        title: '干旱区生态遥感切入点',
        date: '2026-04',
        tag: '选题',
        body: '占位笔记：结合新疆所研究背景，整理可能的交叉选题与数据源清单。'
      }
    ]
  },
  {
    id: 'methods-tools',
    title: '方法与工具',
    titleEn: 'Methods & Tools',
    description: '编程、空间库、分析工作流与可复现实验相关笔记。',
    notes: [
      {
        title: '可复现空间分析工作流',
        date: '2026-03',
        tag: '工程',
        body: '占位笔记：数据版本、脚本组织与结果归档约定，便于后续课题复现。'
      }
    ]
  }
];

const dirList = document.getElementById('dir-list');
const notesTitle = document.getElementById('notes-title');
const notesDesc = document.getElementById('notes-desc');
const noteList = document.getElementById('note-list');

function renderDirs(activeId) {
  dirList.innerHTML = directions.map((d) => `
    <button type="button" class="dir-btn${d.id === activeId ? ' active' : ''}" data-id="${d.id}" role="tab" aria-selected="${d.id === activeId}">
      ${d.title}<span class="dir-count">${d.notes.length}</span>
      <span class="en">${d.titleEn}</span>
    </button>
  `).join('');
}

function renderNotes(dir) {
  notesTitle.textContent = dir.title;
  notesDesc.textContent = dir.description;
  if (!dir.notes.length) {
    noteList.innerHTML = '<div class="empty">该方向暂无笔记，可在 notes.html 的 directions 数据中添加。</div>';
    return;
  }
  noteList.innerHTML = dir.notes.map((n, i) => `
    <article class="note" style="animation-delay:${i * 0.05}s">
      <div class="note-meta">
        <span class="note-date">${n.date}</span>
        ${n.tag ? `<span class="note-tag">${n.tag}</span>` : ''}
      </div>
      <h3>${n.title}</h3>
      <p>${n.body}</p>
    </article>
  `).join('');
}

function showDirection(id) {
  const dir = directions.find((d) => d.id === id) || directions[0];
  renderDirs(dir.id);
  renderNotes(dir);
  history.replaceState(null, '', `#${dir.id}`);
}

dirList.addEventListener('click', (e) => {
  const btn = e.target.closest('.dir-btn');
  if (!btn) return;
  showDirection(btn.dataset.id);
});

const initial = location.hash.replace(/^#/, '') || directions[0].id;
showDirection(initial);
</script>
</body>
</html>
