<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#1c1c1e;
  --muted:#8a8f98;
  --muted-2:#6b7280;
  --accent:#b794f6;
  --accent-strong:#9b7ae8;
  --accent-soft:#efe6ff;
  --heading:#d4a5d8;
  --border:#eceef2;
  --radius:24px;
  --shadow:0 4px 24px rgba(0,0,0,.06);
  --font:'DM Sans','Noto Sans SC',system-ui,sans-serif;
  --danger:#e11d48;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:var(--accent-strong);text-decoration:none}
a:hover{opacity:.85}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{
  font-family:inherit;font-size:.92rem;
  width:100%;padding:10px 12px;
  border:1.5px solid var(--border);border-radius:12px;
  background:#fafafa;color:var(--text);outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted-2);margin-bottom:6px}

.wrap{
  max-width:1100px;margin:0 auto;padding:28px 20px 56px;
  animation:rise .6s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:14px;flex-wrap:wrap;
}
.back{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;
  background:var(--card);box-shadow:var(--shadow);
  color:var(--muted-2);font-size:.9rem;font-weight:500;
}
.back:hover{color:var(--text);opacity:1}
.back svg{width:16px;height:16px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;
  background:var(--card);box-shadow:var(--shadow);
  color:var(--muted-2);font-size:.82rem;font-weight:500;
}
.chip:hover{color:var(--text)}
.storage-tip{
  margin-bottom:16px;padding:12px 16px;border-radius:14px;
  background:#fff8eb;border:1px solid #fde68a;
  color:#92400e;font-size:.84rem;line-height:1.5;
}

.layout{
  display:grid;grid-template-columns:280px minmax(0,1fr);
  gap:18px;align-items:start;
}
.dir-card,.notes-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
}
.dir-card{padding:18px 14px;position:sticky;top:24px}
.dir-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 6px 12px;
}
.dir-head h2{
  font-size:.78rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--heading);
}
.icon-btn{
  width:30px;height:30px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--accent-strong);background:var(--accent-soft);
  font-size:1.1rem;font-weight:600;line-height:1;
}
.icon-btn:hover{filter:brightness(.97)}
.dir-list{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
.dir-item{display:flex;align-items:stretch;gap:2px}
.dir-btn{
  flex:1;text-align:left;
  padding:10px 10px;border-radius:12px;
  color:var(--muted-2);font-size:.9rem;font-weight:500;
  transition:background .2s,color .2s;
}
.dir-btn:hover{background:var(--bg);color:var(--text)}
.dir-btn.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.dir-btn .en{display:block;font-size:.7rem;font-weight:500;color:var(--muted);margin-top:1px}
.dir-btn.active .en{color:var(--accent-strong);opacity:.75}
.dir-count{
  display:inline-flex;min-width:20px;height:18px;padding:0 5px;margin-left:6px;
  border-radius:999px;background:rgba(0,0,0,.06);
  font-size:.68rem;font-weight:600;align-items:center;justify-content:center;
}
.dir-btn.active .dir-count{background:rgba(155,122,232,.2)}
.twist{
  width:28px;flex-shrink:0;border-radius:10px;color:var(--muted);
  font-size:.7rem;display:flex;align-items:center;justify-content:center;
}
.twist:hover{background:var(--bg);color:var(--text)}
.twist.hidden{visibility:hidden}

.notes-card{padding:26px 28px 32px;min-height:480px}
.notes-toolbar{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;
  font-size:.84rem;font-weight:600;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(.96)}
.btn-ghost{background:var(--bg);color:var(--muted-2)}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:#fff1f2;color:var(--danger)}
.notes-label{
  font-size:.78rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--heading);
}
.notes-title{font-size:1.4rem;font-weight:700;letter-spacing:-.03em;margin:6px 0 4px}
.notes-path{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.notes-desc{color:var(--muted-2);font-size:.95rem;margin-bottom:18px;max-width:56ch}
.note-list{display:flex;flex-direction:column;gap:14px}
.note{
  border:1px solid var(--border);border-radius:16px;padding:16px 18px;
  animation:fadeIn .35s ease both;
}
.note:hover{border-color:#e0d4f5;box-shadow:0 6px 18px rgba(155,122,232,.08)}
.note-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.note-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.note-date,.note-tag{
  font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:6px;

.note-date{color:var(--muted);background:#f0f1f4}
.note-tag{color:var(--accent-strong);background:var(--accent-soft)}
.note h3{font-size:1.02rem;font-weight:600;margin-bottom:6px}
.note p{font-size:.9rem;color:var(--muted-2);line-height:1.55;white-space:pre-wrap}
.note-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note-link{
  display:inline-flex;padding:5px 12px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-strong);
  font-size:.78rem;font-weight:600;

.note-link:hover{opacity:1;filter:brightness(.97)}
.note-del{color:var(--muted);font-size:.78rem;padding:4px 8px;border-radius:8px}
.note-del:hover{background:#fff1f2;color:var(--danger)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:.95rem}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,20,30,.35);
  display:none;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(480px,100%);background:var(--card);
  border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);
  padding:22px 22px 18px;animation:fadeIn .25s ease;

.modal h3{font-size:1.1rem;margin-bottom:14px}
.field{margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .dir-card{position:static}
  .dir-list{max-height:none;flex-direction:row;overflow-x:auto;gap:6px}
  .dir-item{flex-direction:column;min-width:150px}
  .twist{display:none}
  .dir-btn .en{display:none}
  .notes-card{padding:22px 18px 28px;min-height:0}
}

function uid(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
}

function clone(data) {
  return JSON.parse(JSON.stringify(data));
}

function loadState(defaults) {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.directions)) return parsed;
    }
  } catch (_) {}
  return { directions: clone(defaults), activeId: defaults[0]?.id || '' };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    directions: state.directions,
    activeId: state.activeId,
    expanded: [...state.expanded]
  }));
}

const state = {
  directions: [],
  activeId: '',
  expanded: new Set()
};

async function loadLocalCatalog() {
  try {
    const res = await fetch('notes/local/catalog.json', { cache: 'no-store' });
    if (!res.ok) return null;
    const data = await res.json();
    return data.tree || null;
  } catch (_) {
    return null;
  }
}

function buildDefaults(localTree) {
  const dirs = clone(BASE_DIRECTIONS);
  if (localTree) dirs.unshift(localTree);
  return dirs;
}

function mergeLocalIntoState(localTree) {
  if (!localTree) return;
  const idx = state.directions.findIndex((d) => d.id === localTree.id);
  if (idx >= 0) state.directions[idx] = clone(localTree);
  else state.directions.unshift(clone(localTree));
  state.expanded.add(localTree.id);
}

let modalSubmit = null;

function walk(nodes, fn, parent = null, path = []) {
  for (const node of nodes) {
    const p = path.concat(node.title);
    fn(node, parent, p);
    if (node.children?.length) walk(node.children, fn, node, p);
  }
}

function findNode(id, nodes = state.directions, parent = null) {
  for (const node of nodes) {
    if (node.id === id) return { node, parent, siblings: nodes };
    if (node.children?.length) {
      const hit = findNode(id, node.children, node);
      if (hit) return hit;
    }
  }
  return null;
}

function countNotes(node) {
  let n = (node.notes || []).length;
  for (const c of node.children || []) n += countNotes(c);
  return n;
}

function ensureNodeShape(node) {
  if (!node.notes) node.notes = [];
  if (!node.children) node.children = [];
  if (!node.titleEn) node.titleEn = '';
  if (!node.description) node.description = '';
}

function renderTree() {
  const rows = [];
  function renderLevel(nodes, depth) {
    for (const node of nodes) {
      ensureNodeShape(node);
      const hasKids = node.children.length > 0;
      const open = state.expanded.has(node.id);
      const active = node.id === state.activeId;
      rows.push(`
        <div class="dir-item" style="padding-left:${depth * 14}px">
          <button type="button" class="twist${hasKids ? '' : ' hidden'}" data-twist="${node.id}" aria-label="展开/折叠">${hasKids ? (open ? '▾' : '▸') : ''}</button>
          <button type="button" class="dir-btn${active ? ' active' : ''}" data-id="${node.id}">
            ${escapeHtml(node.title)}<span class="dir-count">${countNotes(node)}</span>
            ${node.titleEn ? `<span class="en">${escapeHtml(node.titleEn)}</span>` : ''}
          </button>
        </div>
      `);
      if (hasKids && open) renderLevel(node.children, depth + 1);
    }
  }
  renderLevel(state.directions, 0);
  dirList.innerHTML = rows.join('') || '<div class="empty">暂无方向</div>';
}

function escapeHtml(str) {
  return String(str)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function getPathTitles(id) {
  let path = [];
  walk(state.directions, (node, _p, titles) => {
    if (node.id === id) path = titles;
  });
  return path;
}

function renderNotes() {
  const hit = findNode(state.activeId);
  if (!hit) {
    const first = state.directions[0];
    if (!first) {
      notesTitle.textContent = '暂无方向';
      notesDesc.textContent = '点击左侧 + 新建一级方向。';
      notesPath.textContent = '';
      noteList.innerHTML = '';
      return;
    }
    state.activeId = first.id;
    saveState();
    return renderAll();
  }
  const { node } = hit;
  ensureNodeShape(node);
  notesTitle.textContent = node.title;
  notesDesc.textContent = node.description || '暂无描述';
  notesPath.textContent = getPathTitles(node.id).join(' / ');
  if (!node.notes.length) {
    noteList.innerHTML = '<div class="empty">该方向暂无笔记，点击「新建笔记」添加。</div>';
    return;
  }
  noteList.innerHTML = node.notes.map((n, i) => `
    <article class="note" style="animation-delay:${i * 0.04}s">
      <div class="note-top">
        <div>
          <div class="note-meta">
            <span class="note-date">${escapeHtml(n.date || '')}</span>
            ${n.tag ? `<span class="note-tag">${escapeHtml(n.tag)}</span>` : ''}
          </div>
          <h3>${escapeHtml(n.title)}</h3>
          <p>${escapeHtml(n.body || '')}</p>
          ${n.link || n.file ? `<div class="note-links">
            ${n.link ? `<a class="note-link" href="${escapeHtml(n.link)}">阅读全文</a>` : ''}
            ${n.file ? `<a class="note-link" href="${escapeHtml(n.file)}" download>下载原文件</a>` : ''}
          </div>` : ''}
        </div>
        <button type="button" class="note-del" data-del-note="${escapeHtml(n.id)}">删除</button>
      </div>
    </article>
  `).join('');
}

function renderAll() {
  renderTree();
  renderNotes();
  history.replaceState(null, '', `#${state.activeId}`);
}

function openModal(title, fieldsHtml, onSubmit) {
  modalTitle.textContent = title;
  modalBody.innerHTML = fieldsHtml;
  modalSubmit = onSubmit;
  modal.classList.add('open');
  const first = modalBody.querySelector('input,textarea');
  if (first) first.focus();
}

function closeModal() {
  modal.classList.remove('open');
  modalSubmit = null;
}

function todayStamp() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function createDirection(parentId) {
  openModal(parentId ? '新建子方向' : '新建一级方向', `
    <div class="field"><label>中文名称</label><input id="f-title" required placeholder="例如：大气科学"></div>
    <div class="field"><label>英文名称（可选）</label><input id="f-en" placeholder="Atmospheric Science"></div>
    <div class="field"><label>简介</label><textarea id="f-desc" placeholder="方向说明…"></textarea></div>
  `, () => {
    const title = document.getElementById('f-title').value.trim();
    if (!title) return alert('请填写中文名称');
    const node = {
      id: uid('dir'),
      title,
      titleEn: document.getElementById('f-en').value.trim(),
      description: document.getElementById('f-desc').value.trim(),
      notes: [],
      children: []
    };
    if (parentId) {
      const hit = findNode(parentId);
      if (!hit) return;
      ensureNodeShape(hit.node);
      hit.node.children.push(node);
      state.expanded.add(parentId);
    } else {
      state.directions.push(node);
    }
    state.activeId = node.id;
    saveState();
    closeModal();
    renderAll();
  });
}

function createNote() {
  const hit = findNode(state.activeId);
  if (!hit) return alert('请先选择一个方向');
  openModal('新建笔记', `
    <div class="field"><label>标题</label><input id="f-title" required placeholder="笔记标题"></div>
    <div class="field"><label>日期</label><input id="f-date" value="${todayStamp()}"></div>
    <div class="field"><label>标签（可选）</label><input id="f-tag" placeholder="概念 / 方法 / 文献…"></div>
    <div class="field"><label>正文</label><textarea id="f-body" placeholder="写下你的笔记…"></textarea></div>
  `, () => {
    const title = document.getElementById('f-title').value.trim();
    if (!title) return alert('请填写标题');
    ensureNodeShape(hit.node);
    hit.node.notes.unshift({
      id: uid('note'),
      title,
      date: document.getElementById('f-date').value.trim() || todayStamp(),
      tag: document.getElementById('f-tag').value.trim(),
      body: document.getElementById('f-body').value.trim()
    });
    saveState();
    closeModal();
    renderAll();
  });
}

dirList.addEventListener('click', (e) => {
  const twist = e.target.closest('[data-twist]');
  if (twist) {
    const id = twist.dataset.twist;
    if (state.expanded.has(id)) state.expanded.delete(id);
    else state.expanded.add(id);
    saveState();
    renderTree();
    return;
  }
  const btn = e.target.closest('.dir-btn');
  if (!btn) return;
  state.activeId = btn.dataset.id;
  saveState();
  renderAll();
});

noteList.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-del-note]');
  if (!btn) return;
  const hit = findNode(state.activeId);
  if (!hit) return;
  if (!confirm('删除这条笔记？')) return;
  hit.node.notes = hit.node.notes.filter((n) => n.id !== btn.dataset.delNote);
  saveState();
  renderAll();
});

document.getElementById('btn-add-root').addEventListener('click', () => createDirection(null));
document.getElementById('btn-add-child').addEventListener('click', () => createDirection(state.activeId));
document.getElementById('btn-add-note').addEventListener('click', createNote);
document.getElementById('btn-del-dir').addEventListener('click', () => {
  const hit = findNode(state.activeId);
  if (!hit) return;
  if (!confirm(`删除方向「${hit.node.title}」及其全部子方向与笔记？`)) return;
  const idx = hit.siblings.findIndex((n) => n.id === hit.node.id);
  hit.siblings.splice(idx, 1);
  state.activeId = (hit.parent && hit.parent.id) || (state.directions[0] && state.directions[0].id) || '';
  saveState();
  renderAll();
});

modalCancel.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
modalOk.addEventListener('click', () => { if (modalSubmit) modalSubmit(); });

document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ directions: state.directions }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `research-notes-${todayStamp()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.directions)) throw new Error('格式不正确');
    state.directions = data.directions;
    state.activeId = state.directions[0]?.id || '';
    saveState();
    renderAll();
  } catch (err) {
    alert('导入失败：' + err.message);
  }
  e.target.value = '';
});

document.getElementById('btn-reset').addEventListener('click', async () => {
  if (!confirm('恢复默认数据？当前浏览器中新建/修改的内容会被覆盖。')) return;
  const localTree = await loadLocalCatalog();
  const defaults = buildDefaults(localTree);
  state.directions = clone(defaults);
  state.activeId = defaults[0]?.id || '';
  state.expanded = new Set(defaults.map((d) => d.id).concat(['digital-twin', 'atmospheric-science']));
  saveState();
  renderAll();
});

(async function boot() {
  const localTree = await loadLocalCatalog();
  const defaults = buildDefaults(localTree);
  const status = document.getElementById('local-lib-status');
  if (status) {
    status.innerHTML = localTree
      ? ' <strong style="color:#166534">· 已加载本地库（含集中教学）</strong>'
      : ' <span style="color:#92400e">· 未检测到本地库 notes/local/catalog.json</span>';
  }

  const saved = loadState(defaults);
  state.directions = saved.directions;
  state.activeId = saved.activeId || defaults[0]?.id || '';
  state.expanded = new Set(saved.expanded || defaults.map((d) => d.id));

  // Always refresh local tree content when present (so file updates show after reset-less refresh)
  mergeLocalIntoState(localTree);

  const hashId = location.hash.replace(/^#/, '');
  if (hashId && findNode(hashId)) state.activeId = hashId;
  saveState();
  renderAll();
})();
</script>
</body>
</html>
